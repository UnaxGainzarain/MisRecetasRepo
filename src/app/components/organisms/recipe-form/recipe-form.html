<div class="container mt-4">
  <h2>Nueva Receta</h2>
  
  <form [formGroup]="recipeForm" (ngSubmit)="onSubmit()">
    
    <div class="mb-3">
      <label for="title" class="form-label">Título</label>
      <input id="title" type="text" class="form-control" formControlName="title">
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Descripción</label>
      <textarea id="description" class="form-control" formControlName="description"></textarea>
    </div>

    <div class="mb-3">
      <label for="imageUrl" class="form-label">URL de la Imagen</label>
      <input id="imageUrl" type="text" class="form-control" formControlName="imageUrl">
      @if (recipeForm.get('imageUrl')?.value) {
        <img [src]="recipeForm.get('imageUrl')?.value" alt="Previsualización" class="img-thumbnail mt-2" style="max-height: 150px;">
      }
    </div>

    <div class="mb-3">
      <label for="ingredients" class="form-label">Ingredientes (separados por coma)</label>
      <input id="ingredients" type="text" class="form-control" formControlName="ingredients" placeholder="Ej: Huevos, Patatas, Aceite">
    </div>

    <button type="submit" class="btn btn-success" [disabled]="recipeForm.invalid">
      Guardar Receta
    </button>
  </form>
</div>
