<div class="row">
    <div *ngFor="let recipe of recipes" class="col-md-4 mb-4">
        <app-recipe-card 
            [id]="recipe.id"               [title]="recipe.title"
            [description]="recipe.description"
            [ingredients]="recipe.ingredients"
            [imageUrl]="recipe.imageUrl">
        </app-recipe-card>
    </div>
</div>
