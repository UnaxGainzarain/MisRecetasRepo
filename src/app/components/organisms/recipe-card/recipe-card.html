@if (recipe()) {
  <div class="card h-100 shadow-sm">
    <img [src]="recipe().imageUrl" class="card-img-top" [alt]="recipe().title" style="height: 200px; object-fit: cover;">
    <div class="card-body d-flex flex-column">
      <h5 class="card-title">{{ recipe().title }}</h5>
      <p class="card-text text-muted">{{ recipe().description }}</p>

      <h6 class="mt-2">Ingredientes:</h6>
      <ul class="list-group list-group-flush mb-2">
        @for (ingredient of recipe().ingredients; track $index) {
          <li class="list-group-item py-1 px-0">{{ ingredient }}</li>
        }
      </ul>

      </div>
  </div>
}
