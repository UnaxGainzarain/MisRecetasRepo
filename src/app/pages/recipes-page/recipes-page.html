<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Mis Recetas</h1>
    
    <div class="d-flex align-items-center">
      <label class="me-2 fw-bold">Filtrar por valoración:</label>
      <select class="form-select w-auto" [ngModel]="minRatingFilter()" (ngModelChange)="minRatingFilter.set($event)">
        <option [value]="0">Todas</option>
        <option [value]="3">3+ Estrellas</option>
        <option [value]="4">4+ Estrellas</option>
        <option [value]="5">Solo 5 Estrellas</option>
      </select>
    </div>
  </div>

  <app-recipe-list 
    [recipes]="filteredRecipes()" 
    (rateRecipe)="handleRate($event)">
  </app-recipe-list>
</div>
